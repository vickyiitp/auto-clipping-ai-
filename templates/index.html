<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoClip Studio Ultra Pro — Zero-RAM Video to 9:16 Shorts</title>
  <meta name="description" content="Enterprise AI workstation for converting videos into viral 9:16 shorts with kinetic typography. Zero cloud fees, zero RAM spikes.">

  <!-- Studio Google Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Alex+Brush&family=Anton&family=Audiowide&family=Bangers&family=Bebas+Neue&family=Bungee&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&family=Dancing+Script:wght@700&family=Fira+Code:wght@500;600;700&family=Great+Vibes&family=Montserrat:wght@800;900&family=Oswald:wght@700&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@700;800;900&family=Righteous&family=Russo+One&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/style.css?v={{ v or '2.2.0' }}">

  <style>
    /* Inline Fallback & Loader Styles (Guaranteed Zero Black Screen) */
    .studio-initial-backdrop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0b0c10;
      color: #f0f2f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .studio-loader-spinner-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 28px;
    }
    .studio-spinner-ring-1 {
      position: absolute;
      inset: 0;
      border: 3px solid rgba(24, 197, 245, 0.15);
      border-top-color: #18c5f5;
      border-radius: 50%;
      animation: studioLoaderRotate 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .studio-spinner-ring-2 {
      position: absolute;
      inset: 10px;
      border: 3px solid transparent;
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: studioLoaderRotate 1.5s linear infinite reverse;
    }
    .studio-loader-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #ffffff 0%, #18c5f5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .studio-loader-subtitle {
      font-size: 13px;
      color: #718096;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .studio-loader-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      padding: 6px 14px;
      background: rgba(24, 197, 245, 0.08);
      border: 1px solid rgba(24, 197, 245, 0.25);
      border-radius: 20px;
      font-size: 12px;
      color: #18c5f5;
      font-family: 'JetBrains Mono', monospace;
    }
    .studio-fallback-card {
      max-width: 540px;
      background: #14161f;
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      margin-top: 20px;
    }
    .studio-fallback-card h3 {
      color: #ef4444;
      font-size: 18px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    .studio-fallback-card p {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 16px;
    }
    .studio-fallback-reload-btn {
      background: #18c5f5;
      color: #0b0c10;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .studio-fallback-reload-btn:hover {
      opacity: 0.9;
    }
    @keyframes studioLoaderRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Global Error Catcher & Diagnostics
    window.__appMounted = false;
    window.addEventListener('error', function(e) {
      if (!window.__appMounted) {
        var host = document.getElementById('studioFallbackContainer');
        if (host) {
          host.innerHTML =
            '<div class="studio-fallback-card">' +
              '<h3>⚠️ Script Startup Exception</h3>' +
              '<p><strong>Error:</strong> ' + (e.message || 'Unknown JavaScript execution error.') + '</p>' +
              '<p style="font-size:12px;color:#94a3b8;font-family:monospace;">File: ' + (e.filename || 'script') + ' : Line ' + (e.lineno || '?') + '</p>' +
              '<button class="studio-fallback-reload-btn" onclick="location.reload(true)">Force Hard Reload</button>' +
            '</div>';
        }
      }
    });

    // 8-second watchdog to guarantee the user is NEVER left staring at a loader or black screen
    setTimeout(function() {
      if (!window.__appMounted) {
        var host = document.getElementById('studioFallbackContainer');
        if (host && !host.querySelector('.studio-fallback-card')) {
          host.innerHTML =
            '<div class="studio-fallback-card">' +
              '<h3>⚠️ Workstation Initialization Notice</h3>' +
              '<p>The studio took longer than expected to render. This can occur if your browser has cached an older version or blocked ES module scripts.</p>' +
              '<button class="studio-fallback-reload-btn" onclick="location.reload(true)">Clear Cache &amp; Reload</button>' +
            '</div>';
        }
      }
    }, 8000);
  </script>
</head>
<body class="studio-body">

  <!-- Dynamic Pure JavaScript SPA Mount Root with Zero-Black Initial Skeleton -->
  <div id="app">
    <div class="studio-initial-backdrop" id="studioInitialLoader">
      <div class="studio-loader-spinner-wrap">
        <div class="studio-spinner-ring-1"></div>
        <div class="studio-spinner-ring-2"></div>
      </div>
      <h1 class="studio-loader-title">AUTOCLIP STUDIO ULTRA PRO</h1>
      <p class="studio-loader-subtitle">Zero-RAM Biomimetic Kinetic Pipeline • Multi-User Enterprise</p>
      <div class="studio-loader-badge">
        <span>⚡ Hardware Acceleration Ready</span>
      </div>

      <div id="studioFallbackContainer"></div>

      <noscript>
        <div class="studio-fallback-card" style="margin-top:24px;">
          <h3>⚠️ JavaScript Required</h3>
          <p>AutoClip Studio Ultra Pro is a modern real-time Single Page Application. Please enable JavaScript in your browser settings to continue.</p>
        </div>
      </noscript>
    </div>
  </div>

  <!-- Dynamic JS Component Architecture (Version-Busted) -->
  <script type="module" src="/static/js/app.js?v={{ v or '2.2.0' }}"></script>
</body>
</html>
